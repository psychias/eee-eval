# Default pipeline configuration. Values here drive reproduction; keep
# hyperparameters in configs, not in code.

dataset:
  # Canonical ArXiv source = the per-benchmark LLM extraction only.
  arxiv_source: data/arxiv_extraction_general/llm
  exclude_path_components: [samples, naive]   # audit copies + naive extraction
  leaderboard_sources:
    - open_llm_leaderboard_v2
    - alpacaeval2
    - bfcl
    - bigcodebench
    - chatbot_arena
    - evalplus
    - hf_model_card
    - wildbench
    - swe_bench
    - mt_bench

coverage:
  fields: [shots, harness, prompt_template, temperature, chain_of_thought]
  # 0-shot / temperature 0.0 count as documented (explicit None checks, not falsy).

paths:
  aggregate_csv: data/aggregated/all_results.csv
  analysis_out: analysis_output
  paper_numbers: analysis_output/paper_numbers.json

# Expected headline numbers (regenerated by `python scripts/reproduce_paper.py`).
# Used as a reference / regression check, NOT as the source of the numbers.
expected:
  total_records: 37718
  total_models: 6455
  total_benchmarks: 1289
  arxiv_records: 8387
  leaderboard_subtotal: 28755
