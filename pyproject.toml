[project]
name = "every-eval-ever"
version = "0.2.1"
description = "Unified schema and extraction pipeline for LLM evaluation results — ACL 2026 EvalEval Shared Task submission"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    # Core extraction
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "PyYAML>=6.0",          # HF model-card YAML + AlpacaEval scraper
    "tenacity>=8.2,<10",
    "pydantic>=2.5,<3",
    # Analysis & figures
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    # Schema validation
    "jsonschema>=4.17",
    # HuggingFace integration
    "huggingface_hub>=0.20",
    # LLM extraction
    "openai>=1.0",
]

[project.optional-dependencies]
# Dev tooling for `make test` / `make lint` / `make format`.
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Optional CRFM HELM log converter (eee_eval.converters.helm) only —
# not needed for the core extraction/analysis or to reproduce the paper.
helm = [
    "dacite>=1.8",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
# E402 (module-import-not-at-top): intentional in entry-point scripts that must
# configure sys.path / load .env before importing the package.
# F821 here is a forward-reference string annotation ("pd.DataFrame") with a lazy
# pandas import — not a runtime error.
ignore = ["E402", "F821"]
