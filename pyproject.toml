[project]
name = "every-eval-ever"
version = "0.2.1"
description = "Unified schema and extraction pipeline for LLM evaluation results — ACL 2026 EvalEval Shared Task submission"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "google-generativeai>=0.8.0",
    "openai>=2.29.0",
]

[tool.setuptools.packages.find]
include = [
    "src",
    "src.*",
    "src.inspection_adapter",
    "src.inspection_adapter.*",
    "src.converters",
    "src.converters.*",
    "src.extraction",
    "src.extraction.*",
    "src.analysis",
    "src.analysis.*",
    "src.figures",
    "src.figures.*",
    "src.scrapers",
    "src.scrapers.*",
    "src.utils",
    "src.utils.*",
]
